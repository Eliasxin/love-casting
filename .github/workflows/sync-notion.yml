name: Sync Notion Chapters

on:
  workflow_dispatch:
  schedule:
    # 台灣時間每天上午 10:00
    - cron: '0 2 * * *'

permissions:
  contents: write

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync published Love Casting chapters
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_WORK_PAGE_ID: ${{ secrets.NOTION_WORK_PAGE_ID }}
        run: python scripts/sync_notion.py

      - name: Commit chapter updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # 提交同步產生的章節資料
          git add -A -- data/chapters.json

          # 圖片資料夾存在時才提交
          if [ -d assets/notion ]; then
            git add -A -- assets/notion/
          fi

          # 只有檔案變更時才建立 Commit
          if ! git diff --cached --quiet; then
            git commit -m 'Sync public Love Casting chapters from Notion'
            git push
          else
            echo 'No changes to commit.'
          fi
